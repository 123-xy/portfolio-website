<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VerifyCo</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f7f8fb;
        color: #1b1f2a;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0e1017; color: #e6e8ee; }
        .card { background: #171a23 !important; }
      }
      .card {
        max-width: 380px;
        width: 100%;
        background: #ffffff;
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .badge {
        width: 56px; height: 56px; margin: 0 auto 16px;
        border-radius: 16px; display: grid; place-items: center;
        background: #3730c8; color: #fff; font-size: 26px; font-weight: 700;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; margin: 0 0 6px; opacity: 0.8; }
      code {
        display: inline-block; margin-top: 10px; padding: 6px 10px;
        border-radius: 8px; background: rgba(127,127,127,0.15);
        font-size: 12.5px; word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">V</div>
      <h1>VerifyCo</h1>
      <p>This native shell loads the VerifyCo web app from a server you configure.</p>
      <p>Set the server URL and re-sync, then rebuild:</p>
      <code>CAP_SERVER_URL=http://10.0.2.2:3000 npx cap sync android</code>
      <p style="margin-top: 14px">See <strong>mobile/README.md</strong> for the full setup.</p>
    </main>
  </body>
</html>

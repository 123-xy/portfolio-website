# Development overrides — layer on top of the base stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Adds Flower (Celery queue/task monitoring) and turns on SQL echo + debug
# logging. Keep production-only concerns (TLS, restart policies, secrets) out
# of here — see docs/phase-14-docker.md.

services:
  backend:
    environment:
      DEBUG: "true"
      DB_ECHO: "true"

  worker:
    environment:
      DEBUG: "true"

  # Celery monitoring UI at http://localhost:5555 — task history, queue depth,
  # worker status. Dev-only; never exposed in production.
  flower:
    image: mher/flower:2.0
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

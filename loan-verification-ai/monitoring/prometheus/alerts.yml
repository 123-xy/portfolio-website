# Alert rules for the platform. These fire against the metrics the backend
# actually exposes today (HTTP request metrics from
# prometheus-fastapi-instrumentator). Pipeline-stage and queue-depth alerts
# (Phase 2 §4.3) are noted as TODO until the worker exports those metrics — see
# docs/phase-15-deployment.md.

groups:
  - name: backend-availability
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend is not being scraped"
          description: "Prometheus cannot reach the backend /metrics endpoint for >1m."

      - alert: HighServerErrorRate
        # >5% of requests returning 5xx over the last 5 minutes.
        expr: |
          sum(rate(http_requests_total{job="backend",status="5xx"}[5m]))
            / sum(rate(http_requests_total{job="backend"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx error rate on the backend"
          description: "More than 5% of requests have returned 5xx for 5 minutes."

      - alert: HighRequestLatencyP95
        # 95th-percentile request latency above 1s over 5 minutes.
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{job="backend"}[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend p95 latency is high"
          description: "95th-percentile request latency has exceeded 1s for 5 minutes."

# Prometheus scrape configuration for the platform.
# Loaded by the prometheus service in docker-compose.monitoring.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # FastAPI backend — request rate/latency/errors via
  # prometheus-fastapi-instrumentator (app exposes /metrics).
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Prometheus scraping itself (baseline liveness of the monitoring stack).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

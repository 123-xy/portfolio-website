[project]
name = "loan-verification-backend"
version = "0.1.0"
description = "AI Co-Applicant Verification Platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "moto[server]>=5.0.0",
    "boto3-stubs[s3]>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates long, single-statement lines; line length is not
# meaningful for generated migration files.
"app/infrastructure/db/migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # passlib imports the stdlib `crypt` module, deprecated in 3.11; not our code.
    "ignore:'crypt' is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

# passlib and python-jose ship no type information; ignore their missing stubs
# (return values are explicitly coerced at the call sites in infrastructure/auth).
[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# Tests use fakes and fixtures where full strict typing adds noise without
# value; production code under app/ remains fully strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false

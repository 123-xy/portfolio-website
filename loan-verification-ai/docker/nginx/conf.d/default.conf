# Upstreams resolve over the Compose network by service name.
upstream backend_upstream {
    server backend:8000;
}
upstream frontend_upstream {
    server frontend:3000;
}

# Shared proxy headers so the app sees the real client, scheme, and host.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;

# --- HTTP :80 — redirect everything to HTTPS -------------------------------
# (Keep an ACME-challenge location if you terminate Let's Encrypt here.)
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — TLS termination + reverse proxy --------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificates are mounted into the container (see docker-compose.prod.yml).
    # For a real deployment use CA-issued certs (e.g. Let's Encrypt); for local
    # HTTPS testing generate a self-signed pair — see docs/phase-15-deployment.md.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers. HSTS is safe here because everything is redirected to
    # HTTPS above; adjust max-age/preload to your rollout appetite.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API — everything under the versioned prefix goes to FastAPI.
    location /api/ {
        proxy_pass http://backend_upstream;
    }

    # Swagger / ReDoc / OpenAPI live outside /api/ on the backend.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_upstream;
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://frontend_upstream;
    }
}

# Reverse proxy / TLS termination for production.
# Fronts the frontend (Next.js) and backend (FastAPI); terminates TLS so the
# app containers speak plain HTTP on the internal network only.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured-ish access log; forwarded client IP first so it survives the
    # proxy hop (X-Forwarded-For is set on the upstream requests below).
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml;

    # Presigned uploads go direct to object storage, so the API never receives
    # large bodies — but allow generous headroom for report payloads / forms.
    client_max_body_size 25m;

    include /etc/nginx/conf.d/*.conf;
}
